name: Run Anime Crawler

on:
  push:
  workflow_dispatch:
  # Daily scheduling moves to infra/cloudflare/anime1-crawler-trigger.
  # Merge only after its secret, deployment, and Cron dispatch are verified.

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python test/test_crawler.py

      - name: Run main.py
        run: python main.py

      - name: Commit and push anime_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/anime_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update anime_data.json"
            git push
          fi
