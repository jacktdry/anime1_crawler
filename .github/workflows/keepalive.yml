name: Keep scheduled workflows active

on:
  schedule:
    # Every Wednesday at 04:37 UTC (away from the top-of-hour Actions peak).
    - cron: "37 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-workflow-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Refresh repository activity only after 30 idle days
        shell: bash
        run: |
          set -euo pipefail

          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date -u +%s)"
          idle_days="$(((now_epoch - last_commit_epoch) / 86400))"
          echo "Days since last commit: ${idle_days}"

          if (( idle_days < 30 )); then
            echo "Repository activity is recent; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/schedule-keepalive.txt
          git add .github/schedule-keepalive.txt
          git commit -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
